[project]
name = "metacurate"
version = "0.1.0"
description = "Curate a metadata catalog into a list tailored to a use case, using a pluggable System One model"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
web = ["flask>=3.0", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "flask>=3.0", "openpyxl>=3.1"]

[project.scripts]
metacurate = "metacurate.cli:main"
metacurate-web = "metacurate.webapp:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metacurate = ["templates/*.html", "*.mjs"]
